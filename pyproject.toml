[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "citation-pulse"
version = "1.2.0"
description = "Generative Engine Optimization (GEO) and AI search engine citability auditor"
readme = "README.md"
authors = [
  { name = "xcalibur73" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    # PolyForm Noncommercial 1.0.0
    "License :: Free For Educational Use",
    "License :: Free For Non-commercial Use",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0"
]

[project.scripts]
citation-pulse = "citation_pulse.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["citation_pulse*"]
exclude = ["assets*", "tests*"]

[project.urls]
"Homepage" = "https://github.com/xcalibur73/citation-pulse"
"Cloud Engine" = "https://webaudits.pro/tools/citation-pulse"
"Bug Tracker" = "https://github.com/xcalibur73/citation-pulse/issues"
